name: iOS Build

on:
  push:
    branches: ["ios-app"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS project
        run: |
          xcodebuild -project ios/BanaSoyle.xcodeproj \
            -scheme BanaSoyle \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            build
